<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 350" width="300" height="350" fill="none" stroke="#0B2645" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<style>*{vector-effect:non-scaling-stroke}</style>
<title>Model nose</title>
<defs>
<clipPath id="nm-clip"><path d="M97.5 0 C88 70 8 185 0 273 C0 300 8 321 28 329 C62 337 104 350 150 350 C196 350 238 337 272 329 C292 321 300 300 300 273 C292 185 212 70 202.5 0 Z"/></clipPath>
<linearGradient id="nm-side" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#0B2645" stop-opacity="0.26"/><stop offset="0.22" stop-color="#0B2645" stop-opacity="0.07"/>
  <stop offset="0.5" stop-color="#0B2645" stop-opacity="0"/>
  <stop offset="0.78" stop-color="#0B2645" stop-opacity="0.07"/><stop offset="1" stop-color="#0B2645" stop-opacity="0.26"/>
</linearGradient>
<linearGradient id="nm-band" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nm-bandfade" x1="0" x2="0" y1="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.8" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nm-lobe" x1="0" x2="0" y1="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.2"/><stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
</linearGradient>
<mask id="nm-bandmask"><rect x="108" y="0" width="84" height="310" fill="url(#nm-bandfade)"/></mask>
<radialGradient id="nm-tip" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="nm-hole" cx="0.5" cy="0.55" r="0.55">
  <stop offset="0" stop-color="#0d1c2c" stop-opacity="0.92"/><stop offset="0.7" stop-color="#16293f" stop-opacity="0.8"/><stop offset="1" stop-color="#24405a" stop-opacity="0.55"/>
</radialGradient>
<radialGradient id="nm-around" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#0B2645" stop-opacity="0.34"/><stop offset="1" stop-color="#0B2645" stop-opacity="0"/>
</radialGradient>
<filter id="nm-blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="nm-blur5" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<symbol id="nose-model" viewBox="0 0 300 350" overflow="visible">
  <!-- body: translucent gray blue (~40%) so anything placed in the nostril shows through -->
  <path d="M97.5 0 C88 70 8 185 0 273 C0 300 8 321 28 329 C62 337 104 350 150 350 C196 350 238 337 272 329 C292 321 300 300 300 273 C292 185 212 70 202.5 0 Z" fill="#5B6B7C" fill-opacity="0.4" stroke="none"/>
  <g clip-path="url(#nm-clip)" stroke="none">
    <rect x="0" y="0" width="300" height="350" fill="url(#nm-side)"/>
    <!-- darker tone around the nostrils and under the tip -->
    <ellipse cx="90" cy="298" rx="52" ry="30" fill="url(#nm-around)"/><ellipse cx="210" cy="298" rx="52" ry="30" fill="url(#nm-around)"/>
    <path d="M96 292 Q150 330 204 292 Q150 311 96 292 Z" fill="#0B2645" fill-opacity="0.32" filter="url(#nm-blur2)"/>
    <!-- soft shading along the alar creases -->
    <g fill="none" stroke="#0B2645" stroke-opacity="0.2" stroke-width="9" filter="url(#nm-blur5)">
      <path d="M40 188 C62 198 84 218 88 244 C91 262 97 276 110 284"/><path d="M260 188 C238 198 216 218 212 244 C209 262 203 276 190 284"/></g>
    <!-- lighter vertical band down the bridge and over the tip -->
    <rect x="108" y="0" width="84" height="310" fill="url(#nm-band)" mask="url(#nm-bandmask)"/>
    <!-- the tip lobe: slightly lighter body with a soft shadowed lower edge -->
    <path d="M94 192 C90 226 86 258 92 277 C100 295 126 302 150 302 C174 302 200 295 208 277 C214 258 210 226 206 192 Z" fill="url(#nm-lobe)"/>
    <path d="M94 192 C90 226 86 258 92 277 C100 295 126 302 150 302 C174 302 200 295 208 277 C214 258 210 226 206 192" fill="none" stroke="#0B2645" stroke-opacity="0.28" stroke-width="7" filter="url(#nm-blur2)"/>
    <!-- highlight on the tip lobe -->
    <ellipse cx="142" cy="224" rx="26" ry="20" fill="url(#nm-tip)"/>
    <!-- faint lighter rim, like glass -->
    <path d="M97.5 0 C88 70 8 185 0 273 C0 300 8 321 28 329 C62 337 104 350 150 350 C196 350 238 337 272 329 C292 321 300 300 300 273 C292 185 212 70 202.5 0 " fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="7" filter="url(#nm-blur2)"/>
  </g>
  <!-- nostrils: darkest tone of the nose colour, tilted 12 degrees with the outer end higher -->
  <ellipse cx="90" cy="297.5" rx="33" ry="15.75" transform="rotate(12 90 297.5)" fill="url(#nm-hole)" stroke="none"/>
  <ellipse cx="210" cy="297.5" rx="33" ry="15.75" transform="rotate(-12 210 297.5)" fill="url(#nm-hole)" stroke="none"/>
  <!-- thinner lines: alar creases and the tip edge -->
  <g fill="none" stroke="#0B2645" stroke-width="1.6" stroke-opacity="0.55">
    <path d="M40 188 C62 198 84 218 88 244 C91 262 97 276 110 284"/><path d="M260 188 C238 198 216 218 212 244 C209 262 203 276 190 284"/><path d="M94 192 C90 226 86 258 92 277 C100 295 126 302 150 302 C174 302 200 295 208 277 C214 258 210 226 206 192" stroke-opacity="0.55"/>
  </g>
  <!-- outer silhouette: dark blue, 3px -->
  <path d="M97.5 0 C88 70 8 185 0 273 C0 300 8 321 28 329 C62 337 104 350 150 350 C196 350 238 337 272 329 C292 321 300 300 300 273 C292 185 212 70 202.5 0 " fill="none" stroke="#0B2645" stroke-width="3"/>
</symbol>
</defs>
<use href="#nose-model" x="0.00" y="0.00" width="300.00" height="350.00"/>
</svg>
